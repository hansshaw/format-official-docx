name: 缺陷报告
description: 报告格式化、审计或渲染中的可复现问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传含真实公文内容或敏感信息的文件。安全问题请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 或提交 SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、LibreOffice 和 Poppler 版本
      placeholder: Windows 11; Python 3.12; LibreOffice 26.2; Poppler 24.x
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: 受影响命令
      options:
        - apply
        - audit
        - verify
        - Codex 技能调用
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请使用虚构、去标识化内容，并附完整命令与退出码。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可粘贴已去敏的 JSON、错误信息或页面截图。
    validations:
      required: true
  - type: textarea
    id: fonts
    attributes:
      label: 字体状态
      description: 说明五种目标字体是否已安装，以及 Word/LibreOffice 是否发生替换。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认报告和附件不含敏感信息。
          required: true
        - label: 这不是需要私下报告的安全问题。
          required: true

